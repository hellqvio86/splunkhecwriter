[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "splunkhecwriter"
version = "0.5.0"
description = "Library for sending events to Splunk HEC"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Olof Hellqvist", email = "olof.hellqvist@gmail.com" }]
keywords = ["splunk", "hec"]
dependencies = ["requests"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://github.com/hellqvio86/splunkhecwriter"
Repository = "https://github.com/hellqvio86/splunkhecwriter"
Issues = "https://github.com/hellqvio86/splunkhecwriter/issues"

[dependency-groups]
dev = [
    "pylint>=4.1.3",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
