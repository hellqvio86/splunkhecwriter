name: Pylint

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: |
          pyproject.toml
          uv.lock
    - name: Install dependencies
      run: uv sync --locked --group dev
    - name: Analyse the code with pylint
      run: uv run --locked pylint src/splunkhecwriter
    - name: Run unit tests with coverage
      run: uv run --locked pytest --cov=splunkhecwriter --cov-fail-under=90 --cov-report=term-missing --cov-report=json tests/
    - name: Generate Coverage Badge
      if: matrix.python-version == '3.14'
      run: uv run --locked python .github/scripts/generate_coverage_badge.py
    - name: Upload coverage badge artifact
      if: matrix.python-version == '3.14' && github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: coverage-badge
        path: coverage.svg

  update-coverage-badge:
    name: Update Coverage Badge
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
      - name: Download coverage badge artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-badge
      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@8621497c8c39c72f3e2a999a26b4ca1b5058a842 # v5.0.1
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: coverage.svg
